[project]
name = "jev-gmail-filter"
version = "0.1.0.dev0"
description = "Filter Gmail with plain-English topics, powered by jevfilter and TypeSafe's Jev."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jevfilter[yaml]>=0.4,<0.5",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "python-dotenv>=1",
    "streamlit>=1.40",
]

[project.scripts]
jev-gmail-filter = "jev_gmail_filter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
