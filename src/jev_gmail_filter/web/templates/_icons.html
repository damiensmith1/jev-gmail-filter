{% macro icon(name, size=16) -%}

{%- elif name == "needs" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>
{%- elif name == "everything" %}<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>

{%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == "external" %}<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>

{%- elif name == "check" %}<path d="m5 12 5 5 9-10"/>
{%- elif name == "sync" %}<path d="M20 11a8 8 0 0 0-14.9-3.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.5L20 15"/><path d="M20 20v-5h-5"/>
{%- endif -%}
</svg>
{%- endmacro %}
